# Netlify configuration — apoi2.is-a.dev
# The site is a fully static Astro build; Netlify serves it from its edge CDN.
# Custom domain: apoi2.is-a.dev (CNAME -> apoi2.netlify.app, registered via is-a.dev).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[headers]
  # Cache immutable build assets hard; HTML stays must-revalidate.
  for = "/*"

[headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
