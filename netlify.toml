# Netlify configuration — apoi2.is-a.dev
# Fully static Astro build served from Netlify's edge CDN.
# Custom domain: apoi2.is-a.dev (CNAME → apoi2.netlify.app, registered via is-a.dev).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Security headers for every response (no Cache-Control here: Netlify's
# default HTML caching stays in charge for documents).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
