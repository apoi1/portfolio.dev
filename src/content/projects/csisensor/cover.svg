<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="550" fill="#0a0a13"/>
  <rect width="880" height="550" fill="url(#grid)"/>
  <circle cx="640" cy="180" r="190" fill="url(#glow)"/>

  <!-- radar rings -->
  <g transform="translate(660 168)" stroke="#22d3ee" stroke-opacity="0.5" fill="none">
    <circle r="28"/>
    <circle r="58" stroke-opacity="0.32"/>
    <circle r="88" stroke-opacity="0.2"/>
    <circle r="118" stroke-opacity="0.1" stroke-dasharray="3 7"/>
    <circle r="14" fill="#22d3ee" fill-opacity="0.85" stroke="none"/>
  </g>
  <g stroke="#22d3ee" stroke-opacity="0.65">
    <path d="M660 168 L816 60"/>
    <path d="M660 168 L782 268"/>
  </g>
  <text x="782" y="52" fill="#22d3ee" font-size="15" opacity="0.9">RX</text>
  <text x="716" y="288" fill="#a7a7bb" font-size="14">esp32/+/csi/raw</text>

  <!-- ESP32 board -->
  <g transform="translate(84 96)">
    <rect width="150" height="92" rx="10" fill="#0e0e1b" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="18" y="34" fill="#a78bfa" font-size="17" letter-spacing="2">ESP32-S3</text>
    <text x="18" y="58" fill="#64647e" font-size="12">CSI @ 10 Hz</text>
    <path d="M18 74h60" stroke="#3ddc97" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="18" y="86" fill="#3ddc97" font-size="10" opacity="0.8">MQTT ▸</text>
    <path d="M126 12v-8m12 8v-14m12 14v-8m12 8v-14" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- heartbeat -->
  <path d="M40 330h90l18-52 22 104 20-84 16 44 14-12h110l16-38 20 74 16-50 14 26h58" fill="none" stroke="url(#vg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="312" fill="#7c5cff" font-size="14" letter-spacing="2">HEART 0.8–2.0 Hz · 72 BPM</text>

  <!-- breathing -->
  <path d="M40 430c60-26 120-26 180 0s120 26 180 0 120-26 180 0 90 20 120 10" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <text x="40" y="412" fill="#22d3ee" font-size="14" letter-spacing="2" opacity="0.9">RESP 0.1–0.5 Hz</text>

  <!-- subcarrier heatmap -->
  <g transform="translate(600 356)">
    <text x="0" y="-14" fill="#64647e" font-size="13">SUBCARRIER SNR</text>
    <g stroke-opacity="0.25">
      <rect x="0" y="0" width="26" height="26" rx="4" fill="#7c5cff" fill-opacity="0.08" stroke="#a78bfa"/>
      <rect x="32" y="0" width="26" height="26" rx="4" fill="#7c5cff" fill-opacity="0.2" stroke="#a78bfa"/>
      <rect x="64" y="0" width="26" height="26" rx="4" fill="#7c5cff" fill-opacity="0.45" stroke="#a78bfa"/>
      <rect x="0" y="32" width="26" height="26" rx="4" fill="#22d3ee" fill-opacity="0.5" stroke="#22d3ee"/>
      <rect x="32" y="32" width="26" height="26" rx="4" fill="#7c5cff" fill-opacity="0.12" stroke="#a78bfa"/>
      <rect x="64" y="32" width="26" height="26" rx="4" fill="#7c5cff" fill-opacity="0.06" stroke="#a78bfa"/>
    </g>
  </g>

  <!-- footer labels -->
  <g fill="#64647e" font-size="14">
    <text x="84" y="496">FFT · HANN · QUADRATIC PEAK</text>
    <text x="480" y="496" fill="#3ddc97">SNR GATE 9 dB</text>
  </g>
  <path d="M40 512h800" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="836" y="530" fill="#f2f2fa" font-size="15" font-weight="bold" text-anchor="end" opacity="0.85">50 TESTS · v0.1.0</text>
</svg>
