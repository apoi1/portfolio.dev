<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#34C77E"/>
    </linearGradient>
  </defs>

  <rect width="880" height="550" fill="#151310"/>
  <rect width="880" height="550" fill="url(#grid)"/>

  <!-- pipeline boxes -->
  <g font-size="16" letter-spacing="3">
    <rect x="56" y="120" width="170" height="64" rx="12" fill="#1C1915" stroke="#FFB000" stroke-opacity="0.6"/>
    <text x="141" y="157" fill="#E8BC5A" text-anchor="middle">INGEST</text>

    <rect x="286" y="120" width="170" height="64" rx="12" fill="#1C1915" stroke="#FFB000" stroke-opacity="0.6"/>
    <text x="371" y="157" fill="#E8BC5A" text-anchor="middle">SCORE</text>

    <rect x="516" y="120" width="170" height="64" rx="12" fill="#1C1915" stroke="#34C77E" stroke-opacity="0.6"/>
    <text x="601" y="157" fill="#34C77E" text-anchor="middle">TRACK</text>

    <rect x="746" y="120" width="96" height="64" rx="12" fill="#1C1915" stroke="#34C77E" stroke-opacity="0.6"/>
    <text x="794" y="157" fill="#34C77E" text-anchor="middle" font-size="14">TAILOR</text>
  </g>
  <g stroke="url(#pipe)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9" fill="none">
    <path d="M226 152h60"/>
    <path d="M456 152h60"/>
    <path d="M686 152h60"/>
  </g>

  <!-- sources -->
  <g fill="#64647e" font-size="14">
    <text x="56" y="230">RSS</text>
    <text x="106" y="230">GREENHOUSE</text>
    <text x="228" y="230">LEVER</text>
    <text x="292" y="230">HN</text>
    <text x="336" y="230">GETONBOARD</text>
    <text x="456" y="230">+4 MORE</text>
  </g>

  <!-- terminal -->
  <g transform="translate(56 268)">
    <rect width="560" height="212" rx="14" fill="#1C1915" stroke="#ffffff" stroke-opacity="0.1"/>
    <g fill="#64647e">
      <circle cx="26" cy="26" r="5" fill="#fb7185"/>
      <circle cx="46" cy="26" r="5" fill="#FFC95C"/>
      <circle cx="66" cy="26" r="5" fill="#34C77E"/>
    </g>
    <text x="84" y="31" fill="#64647e" font-size="13">chambas — cron 06:37</text>
    <g font-size="15">
      <text x="28" y="70" fill="#F4F1E8"><tspan fill="#FFB000">$</tspan> chambas ingest</text>
      <text x="52" y="96" fill="#ABA595">→ 18 new · 6 high-match · 0 burned out</text>
      <text x="28" y="132" fill="#F4F1E8"><tspan fill="#FFB000">$</tspan> chambas score --all</text>
      <text x="52" y="158" fill="#ABA595">→ 441 jobs · 67 role-tagged · es/en</text>
      <text x="28" y="194" fill="#F4F1E8"><tspan fill="#34C77E">✓</tspan> 477/477 tests passing</text>
    </g>
  </g>

  <!-- SQLite cylinder -->
  <g transform="translate(672 296)">
    <ellipse cx="70" cy="34" rx="70" ry="22" fill="#1C1915" stroke="#34C77E" stroke-opacity="0.7"/>
    <path d="M0 34v96c0 12 31 22 70 22s70-10 70-22V34" fill="#1C1915" stroke="#34C77E" stroke-opacity="0.35" fill-opacity="0.6"/>
    <path d="M0 82c0 12 31 22 70 22s70-10 70-22" fill="none" stroke="#34C77E" stroke-opacity="0.25"/>
    <text x="70" y="180" fill="#34C77E" font-size="14" text-anchor="middle" opacity="0.9">SQLite · 441 jobs</text>
  </g>

  <text x="56" y="522" fill="#64647e" font-size="14">INTEGRITY RULE: ONLY VERIFIED PROFILE FACTS — NEVER INVENTS EXPERIENCE</text>
  <text x="836" y="522" fill="#F4F1E8" font-size="15" font-weight="bold" text-anchor="end" opacity="0.85">477 TESTS</text>
</svg>
